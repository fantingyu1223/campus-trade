services:
  mysql:
    image: mysql:8.0
    container_name: campus-trade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: campus123
      MYSQL_DATABASE: campus_trade
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcampus123"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - campus-mysql-data:/var/lib/mysql
volumes:
  campus-mysql-data:
