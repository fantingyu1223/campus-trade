# ============================================================================
# CI 流水线 —— 校园二手交易平台
#
# 触发：push / pull_request（所有分支）
# 阶段：npm ci → server build → server test → 跨模块 import 扫描 → admin-web build
# 通过标准：server build/test/边界扫描必须绿；admin-web 骨架阶段允许失败
#          （continue-on-error，骨架完善后应移除该容忍）。
# ============================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Server build
        run: npm run build:server

      - name: Server test
        run: npm run test:server

      - name: Cross-module import boundary check
        run: bash scripts/check-cross-module-imports.sh

      # 可选 stage：admin-web 尚处骨架阶段，构建失败不阻塞 CI。
      # TODO: 骨架完善后移除 continue-on-error。
      - name: Admin-web build (optional)
        continue-on-error: true
        run: npm run build --workspace admin-web
